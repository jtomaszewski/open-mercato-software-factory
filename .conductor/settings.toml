"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

# Conductor per-worktree isolation for a thin Open Mercato monorepo. Install at
# `.conductor/settings.toml`; ship the three sibling scripts + `.worktreeinclude` too
# (see the conductor/ template dir). Each worktree runs concurrently in isolation:
#   - Port:     $CONDUCTOR_PORT gives every worktree its own dev-server port (run hook).
#   - Database: setup maintains a project TEMPLATE DB (named after the compose project, migrated
#               + seeded once) and CLONES each worktree's own DB from it (CREATE DATABASE
#               <worktree> TEMPLATE om-software-factory) — so a new worktree starts already seeded,
#               with no per-worktree reseed. The worktree DB name is derived from the worktree
#               folder and written into this worktree's own .env.
#   - Infra:    one shared Postgres/Redis/Meilisearch docker stack (compose project
#               om-software-factory), reused across worktrees; per-worktree DBs are separate
#               databases inside it.
# `.worktreeinclude` copies .env per worktree (not symlinked) so the DATABASE_URL rewrite stays
# local. setup = one-time provisioning; run = migrate (branch catch-up) + dev.
[scripts]
setup = "./scripts/conductor-setup.sh"
run = "./scripts/conductor-run.sh"
run_mode = "concurrent"
